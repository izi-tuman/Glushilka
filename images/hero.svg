<svg viewBox="0 0 560 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a software dashboard">
  <defs>
    <linearGradient id="h1" x1="0" y1="0" x2="560" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eef3ff"/>
      <stop offset="1" stop-color="#e3ecff"/>
    </linearGradient>
    <linearGradient id="h2" x1="60" y1="60" x2="500" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2f5fe0"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="560" height="420" rx="20" fill="url(#h1)"/>
  <!-- main panel -->
  <rect x="60" y="70" width="440" height="280" rx="16" fill="#ffffff" stroke="#dbe4f7"/>
  <rect x="60" y="70" width="440" height="48" rx="16" fill="#f4f7ff"/>
  <circle cx="86" cy="94" r="5" fill="#cdd9f2"/>
  <circle cx="104" cy="94" r="5" fill="#cdd9f2"/>
  <circle cx="122" cy="94" r="5" fill="#cdd9f2"/>
  <!-- sidebar -->
  <rect x="76" y="134" width="96" height="200" rx="10" fill="#f4f7ff"/>
  <rect x="90" y="152" width="68" height="10" rx="5" fill="#d6e0f6"/>
  <rect x="90" y="176" width="52" height="10" rx="5" fill="#d6e0f6"/>
  <rect x="90" y="200" width="60" height="10" rx="5" fill="#d6e0f6"/>
  <rect x="90" y="224" width="44" height="10" rx="5" fill="#d6e0f6"/>
  <!-- chart card -->
  <rect x="188" y="134" width="296" height="96" rx="10" fill="#ffffff" stroke="#e6ecfa"/>
  <polyline points="206,206 250,182 292,194 336,158 380,172 424,140 466,150" fill="none" stroke="url(#h2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="466" cy="150" r="5" fill="#2f5fe0"/>
  <!-- metric cards -->
  <rect x="188" y="246" width="92" height="88" rx="10" fill="#eef3ff"/>
  <rect x="290" y="246" width="92" height="88" rx="10" fill="#eef3ff"/>
  <rect x="392" y="246" width="92" height="88" rx="10" fill="#eef3ff"/>
  <rect x="204" y="266" width="40" height="10" rx="5" fill="#bcccf0"/>
  <rect x="204" y="288" width="58" height="16" rx="6" fill="#2f5fe0"/>
  <rect x="306" y="266" width="40" height="10" rx="5" fill="#bcccf0"/>
  <rect x="306" y="288" width="58" height="16" rx="6" fill="#5b8cff"/>
  <rect x="408" y="266" width="40" height="10" rx="5" fill="#bcccf0"/>
  <rect x="408" y="288" width="58" height="16" rx="6" fill="#8fb0ff"/>
  <!-- floating badge -->
  <g>
    <rect x="430" y="44" width="86" height="54" rx="12" fill="#10203f"/>
    <rect x="446" y="60" width="40" height="8" rx="4" fill="#5b8cff"/>
    <rect x="446" y="76" width="54" height="8" rx="4" fill="#3a4d74"/>
  </g>
</svg>
